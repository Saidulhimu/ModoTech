<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0F1216" />
    </linearGradient>

    <!-- Gadget Red Accent Gradient -->
    <linearGradient id="techRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#C53030" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E53E3E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Tech Border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#2D3748" stroke-width="4" opacity="0.6" />

  <!-- Inner Tech Ambient Radial Glow -->
  <circle cx="256" cy="256" r="140" fill="#E53E3E" opacity="0.08" />

  <!-- Gadget Emblem: Premium Wireless Smart Headphone & Soundwave Core -->
  <g filter="url(#glow)">
    <!-- Headband Arc -->
    <path
      d="M144 260 C144 154 200 110 256 110 C312 110 368 154 368 260"
      fill="none"
      stroke="url(#techRed)"
      stroke-width="32"
      stroke-linecap="round"
    />

    <!-- Headband Cushioned Segment -->
    <path
      d="M190 170 C210 148 232 140 256 140 C280 140 302 148 322 170"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Left Ear Cup (Ergonomic Pill) -->
    <rect x="116" y="240" width="56" height="110" rx="28" fill="url(#techRed)" />
    <rect x="126" y="255" width="14" height="80" rx="7" fill="#FFFFFF" opacity="0.3" />

    <!-- Right Ear Cup (Ergonomic Pill) -->
    <rect x="340" y="240" width="56" height="110" rx="28" fill="url(#techRed)" />
    <rect x="372" y="255" width="14" height="80" rx="7" fill="#FFFFFF" opacity="0.3" />

    <!-- Central Audio / Tech Pulse Bars -->
    <rect x="216" y="270" width="12" height="50" rx="6" fill="url(#cyanGlow)" />
    <rect x="236" y="245" width="12" height="100" rx="6" fill="#FFFFFF" />
    <rect x="256" y="225" width="12" height="140" rx="6" fill="url(#techRed)" />
    <rect x="276" y="245" width="12" height="100" rx="6" fill="#FFFFFF" />
    <rect x="296" y="270" width="12" height="50" rx="6" fill="url(#cyanGlow)" />
  </g>
</svg>

